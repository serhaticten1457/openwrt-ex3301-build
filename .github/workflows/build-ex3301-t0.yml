name: Build ZyXEL EX3301-T0 initramfs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ex3301-t0.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build initramfs for EX3301-T0 (econet/en751627)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout OpenWrt main
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          path: openwrt
          fetch-depth: 1

      - name: Checkout patches repo
        uses: actions/checkout@v4
        with:
          repository: koenieee/VMG8825-T50-Openwrt-support
          path: patches
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-full rsync unzip zlib1g-dev file wget ccache xsltproc

      - name: Apply EN751627/MT7530 patches
        working-directory: openwrt
        run: |
          # Copy relevant patches from patches repo (correct paths)
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/781-v7.3-net-dsa-mt7530-add-en7528-support.patch target/linux/econet/patches-6.6/
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/782-net-dsa-mt7530-add-en751627-support.patch target/linux/econet/patches-6.6/
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/783-net-dsa-mt7530-en751627-five-user-ports.patch target/linux/econet/patches-6.6/
          
          # PCIe PHY patches
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/030-v7.1-mips-dts-Add-PCIe-to-EcoNet-EN751221.patch target/linux/econet/patches-6.6/
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/033-01-v7.2-dt-bindings-phy-Document-PCIe-PHY-in-EcoNet-EN751221.patch target/linux/econet/patches-6.6/
          cp ../patches/openwrt-overlay/target/linux/econet/patches-6.18/033-02-v7.2-phy-econet-Add-PCIe-PHY-driver-for-EcoNet-EN751221-a.patch target/linux/econet/patches-6.6/

      - name: Create ZyXEL EX3301-T0 profile
        working-directory: openwrt
        run: |
          mkdir -p target/linux/econet/en751627/profiles
          cat > target/linux/econet/en751627/profiles/zyxel_ex3301-t0.mk << 'EOF'
          define Profile/zyxel_ex3301-t0
            NAME:=ZyXEL EX3301-T0
            PACKAGES:=kmod-mt7915e kmod-mt76-usb uboot-envtools
          endef
          $(eval $(call Profile,zyxel_ex3301-t0))
          EOF

      - name: Configure build (defconfig)
        working-directory: openwrt
        run: |
          make defconfig TARGET=econet SUBTARGET=en751627 PROFILE=zyxel_ex3301-t0
          # Enable initramfs and MT7915E
          echo 'CONFIG_TARGET_INITRAMFS=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt7915e=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt76-usb=y' >> .config
          make defconfig

      - name: Download package feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          make -j$(nproc) 2>&1 | tee build.log

      - name: Find initramfs image
        working-directory: openwrt
        id: find_image
        run: |
          IMAGE=$(find bin/targets/econet/en751627 -name "*initramfs*" -name "*.bin" | head -1)
          if [ -z "$IMAGE" ]; then
            echo "No initramfs image found!"
            find bin/targets -name "*.bin" | head -20
            exit 1
          fi
          echo "Found: $IMAGE"
          echo "image_path=$IMAGE" >> $GITHUB_OUTPUT

      - name: Upload initramfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ex3301-t0-initramfs
          path: ${{ steps.find_image.outputs.image_path }}
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: openwrt/build.log
          retention-days: 7