name: Build ZyXEL EX3301-T0 initramfs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-ex3301-t0.yml'

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build initramfs for EX3301-T0 (econet/en751627)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout OpenWrt main
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          path: openwrt
          fetch-depth: 1

      - name: Fetch and checkout PR #22945 (EX3301-T0 support)
        working-directory: openwrt
        run: |
          git fetch origin pull/22945/head:ex3301
          git checkout ex3301
          echo "Checked out PR #22945 branch ex3301"

      - name: Fetch and merge PR #25475 (Ethernet support)
        working-directory: openwrt
        run: |
          git fetch origin pull/25475/head:pr25475
          git merge --no-edit pr25475
          echo "Merged PR #25475 branch pr25475"

      - name: Add read-only protection to critical NAND partitions
        working-directory: openwrt
        run: |
          # Add read-only to factory_data, factory, rom-d, misc, reservearea, tclinux_kernel, ubi
          awk '
            /label = / { current_label = $0; gsub(/.*label = "/, "", current_label); gsub(/\".*/, "", current_label) }
            /reg = / && current_label ~ /^(factory_data|factory|rom-d|misc|reservearea|tclinux_kernel|ubi)$/ { print; print "\t\tread-only;"; next }
            { print }
          ' target/linux/econet/dts/en751627_zyxel_ex3301-t0.dts > tmp.dts && mv tmp.dts target/linux/econet/dts/en751627_zyxel_ex3301-t0.dts
          echo "Partition protection added"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk coreutils \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-full rsync unzip zlib1g-dev file wget ccache xsltproc

      - name: Download package feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build (.config)
        working-directory: openwrt
        run: |
          # List existing image and DTS files before configuring
          echo "=== target/linux/econet/image/ ==="
          ls -la target/linux/econet/image/ 2>/dev/null || echo "Directory does not exist"
          echo "=== target/linux/econet/dts/ ==="
          ls -la target/linux/econet/dts/ 2>/dev/null || echo "Directory does not exist"

          # Manuel .config - make defconfig çalıştırılmadan doğrudan yaz
          cat > .config << 'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751627=y
          CONFIG_TARGET_econet_en751627_DEVICE_zyxel_ex3301-t0=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_ethtool=y
          EOF

          # Add missing PHY/PCI symbols to EcoNet kernel config files BEFORE defconfig to prevent syncconfig prompts
          for cfg in target/linux/econet/config-* target/linux/econet/en751627/config-*; do
            if [ -f "$cfg" ]; then
              echo "CONFIG_PHY_EN7528_PCIE=y" >> "$cfg"
              echo "CONFIG_PHY_EN7528_USB=y" >> "$cfg"
              echo "CONFIG_PCI=y" >> "$cfg"
              echo "CONFIG_PCI_EN7528=y" >> "$cfg"
            fi
          done

          # Run defconfig to expand defaults (pipe yes to prevent syncconfig prompts)
          yes "" | make defconfig

          # Verify CONFIG_TARGET_econet_en751627_DEVICE_zyxel_ex3301-t0=y is still present AFTER defconfig
          grep "CONFIG_TARGET_econet_en751627_DEVICE_zyxel_ex3301-t0=y" .config || {
            echo "HATA: Profil seçilmedi, target/linux/econet/image/ icerigi:"
            ls -la target/linux/econet/image/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          }

          echo "Config verified: CONFIG_TARGET_econet_en751627_DEVICE_zyxel_ex3301-t0=y is present"

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          set -o pipefail
          make FORCE=1 -j$(nproc) < /dev/null 2>&1 | tee build.log
          BUILD_EXIT_CODE=$?
          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then
            echo "=== PARALEL DERLEME KIRILDI! HATA DETAYI ICIN V=s CALISTIRILIYOR ==="
            make FORCE=1 -j1 V=s target/linux/compile 2>&1 | tee -a build.log
            exit 1
          fi

      - name: Find initramfs image(s)
        working-directory: openwrt
        id: find_image
        run: |
          IMAGES=$(find bin/targets/ -type f \( -name "*.bin" -o -name "*.itb" -o -name "*initramfs*" \) 2>/dev/null | grep 'ex3301-t0' | head -20)
          if [ -z "$IMAGES" ]; then
            echo "No ex3301-t0 .bin/.itb/initramfs files found anywhere in bin/targets!"
            echo "Searching all bin/targets..."
            find bin/targets -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found images:"
          echo "$IMAGES"
          echo "image_list<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload initramfs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ex3301-t0-initramfs
          path: openwrt/bin/targets/
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: openwrt/build.log
          retention-days: 7